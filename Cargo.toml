[package]
name = "hot_dog"
version = "0.1.0"
authors = ["Dominick DeLorenzo <49847428+domdelorenzo@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0", features = ["fullstack", "router"] }
reqwest = { version = "0.12.12", features = ["json"] }
rusqlite = { version = "0.34.0", features = ["bundled"], optional = true }
serde = { version = "1.0.218", features = ["derive"] }


[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:rusqlite"]


[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[bundle]
name = "hot_dog"
version = "0.1.0"
description = "A Rust app for hot dog lovers"
identifier = "com.demo.hotdog"
